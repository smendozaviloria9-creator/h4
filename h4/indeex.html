<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Módulo 3</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Gestor de Tareas</h1>
            <p class="subtitle">Módulo 3 - JavaScript & API Integration</p>
        </header>

        <!-- Sección del Formulario -->
        <section class="form-section">
            <form id="taskForm">
                <div class="input-group">
                    <input type="text" id="taskInput" placeholder="¿Qué vas a comprar?" required autocomplete="off">
                    <input type="text" id="taskimput" placeholder="precio" required autocomplete="off">
                    <button type="submit" id="addBtn">Agregar</button>
                </div>
            </form>
        </section>

        <!-- Acciones de Sincronización -->
        <section class="actions-section">
            <button id="syncBtn" class="btn-secondary">
                <span>🔄</span> sincronizar
            </button>
        </section>

        <!-- Contenedor de la Lista -->
        <section class="list-section">
            <ul id="taskList">
                <!-- Los elementos li se generarán dinámicamente con JS -->
            </ul>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
